baseURL: https://aegisexplorer.org/
locale: en-us
title: Aegis Explorer
enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra

params:
  description: >-
    Aegis Explorer is a Chrome extension that hides explicit content, drugs,
    gambling, games and profanity on web pages before children see them.
    Made by Aegis Technologies LLC.
  images:
    - /images/social-card.png

  company: Aegis Technologies LLC
  email: contact@aegisexplorer.org
  chromeStoreURL: https://chromewebstore.google.com/detail/aaepaimdjblkleipgbkgmokokdmdhpob

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /logo.png
      # dark: images/logo-dark.svg
      link: /
      width: 40
      height: 40
    width: wide

  footer:
    enable: true
    # The copyright line is rendered by layouts/_partials/custom/footer.html
    displayCopyright: false
    displayPoweredBy: false
    width: normal

  page:
    # full (100%), wide (90rem), normal (80rem)
    width: normal

  theme:
    # light | dark | system
    default: system
    displayToggle: true

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)']]
        enable: true

menu:
  main:
    - identifier: how-it-works
      name: How it works
      url: /#how-it-works
      weight: 1
    - identifier: documentation
      name: Docs
      pageRef: /docs
      weight: 2
    - identifier: privacy
      name: Privacy
      pageRef: /privacy
      weight: 3
    - identifier: about
      name: About
      pageRef: /about
      weight: 4
    - name: Add to Chrome
      weight: 5
      url: "https://chromewebstore.google.com/detail/aaepaimdjblkleipgbkgmokokdmdhpob"
      params:
        external: true
        type: link
        icon: download
    - name: Search
      weight: 6
      params:
        type: search

security:
  enableInlineShortcodes: false
  http:
    methods:
      - "(?i)GET|POST"
    urls:
      - '(?i)^https://cdn\.jsdelivr\.net/'
      - "(?i)^https?://[a-z]"
      - "!(?i)https?://localhost"
      - "!@"
